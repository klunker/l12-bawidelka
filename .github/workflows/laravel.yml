name: tests

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            NODE_OPTIONS: '--no-deprecation'

        strategy:
            fail-fast: false
            matrix:
                php: ['8.5']

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: xdebug

            - name: Setup Vite+ (Node + pnpm + install)
              uses: voidzero-dev/setup-vp@v1.21.2
              with:
                  node-version: '24'
                  cache: true

            - name: Install Dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --no-scripts

            - name: Copy Environment File
              run: cp .env.example .env

            - name: Generate Application Key
              run: php artisan key:generate

            - name: Build Assets
              run: vp build

            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(node -p "((require('./package.json').devDependencies || {})['@playwright/test'] || (require('./package.json').dependencies || {})['@playwright/test'] || 'latest')")" >> $GITHUB_OUTPUT

            - name: Cache Playwright Browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright Browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: vp exec playwright install --with-deps

            - name: Install Playwright System Dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: vp exec playwright install-deps

            - name: Cache Rector
              uses: actions/cache@v4
              with:
                  path: /tmp/rector
                  key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-rector-

            - name: Cache PHPStan
              uses: actions/cache@v4
              with:
                  path: /tmp/phpstan
                  key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
                  restore-keys: ${{ runner.os }}-phpstan-

            - name: Create Cache Directories
              run: mkdir -p /tmp/rector /tmp/phpstan

            - name: Tests
              run: composer test
              env:
                  APP_ENV: testing

            - name: Store Artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: browser-screenshots
                  path: tests/Browser/Screenshots
